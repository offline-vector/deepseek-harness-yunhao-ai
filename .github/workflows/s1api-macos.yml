name: Package S1API macOS

on:
  workflow_dispatch:
  push:
    branches: [codex/s1api-desktop]
    paths: [.github/workflows/s1api-macos.yml]

permissions:
  contents: read

concurrency:
  group: s1api-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-14
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      DSH_TELEMETRY_DISABLED: '1'
      RELEASE_VERSION: 0.2.1-alpha.3.20261016.1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check packaging toolchain
        run: pnpm run package:desktop:mac:arm64:unsigned --check
      - name: Build unsigned DMG
        run: pnpm run package:desktop:mac:arm64:unsigned --build-version "$RELEASE_VERSION"
      - name: Verify application and DMG
        run: |
          app='apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/mac-arm64/S1API.app'
          dmg="apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/deepseek-harness-$RELEASE_VERSION-mac-arm64-unsigned.dmg"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$app/Contents/Info.plist")" = 'S1API'
          test -f "$dmg"
          hdiutil verify "$dmg"
      - name: Prepare DMG download and checksum
        run: |
          dmg="apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/deepseek-harness-$RELEASE_VERSION-mac-arm64-unsigned.dmg"
          mkdir -p distribution
          output="distribution/S1API-$RELEASE_VERSION-mac-arm64-unsigned.dmg"
          cp "$dmg" "$output"
          shasum -a 256 "$output" > distribution/SHA256SUMS.txt
      - name: Retain macOS DMG
        uses: actions/upload-artifact@v7.0.1
        with:
          name: s1api-macos-arm64-dmg
          path: distribution/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: s1api-macos-logs
          path: apps/desktop/.desktop-build/packaging-runs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
