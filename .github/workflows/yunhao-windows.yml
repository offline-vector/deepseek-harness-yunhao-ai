name: Package Yunhao AI Windows

on:
  workflow_dispatch:
  push:
    branches: [codex/yunhao-ai-s1api]
    paths: [.github/workflows/yunhao-windows.yml]

permissions:
  contents: read

concurrency:
  group: yunhao-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.16.0'
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          exit $LASTEXITCODE
      - name: Check packaging toolchain
        run: |
          pnpm run package:desktop:win:x64:unsigned --check
          exit $LASTEXITCODE
      - name: Build installer and verify packaged runtime
        run: |
          pnpm run package:desktop:win:x64:unsigned --build-version 0.2.1-alpha.3.20261015.4
          exit $LASTEXITCODE
      - name: Verify application name and unsigned metadata
        run: |
          $app = 'apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/win-unpacked/YHAI.exe'
          if (!(Test-Path $app)) { throw 'YHAI.exe was not packaged' }
          if ((Get-Item $app).VersionInfo.ProductName -ne '韵浩 AI') { throw 'Unexpected product name' }
      - name: Retain Windows installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: yunhao-ai-windows-x64
          path: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Retain packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: yunhao-windows-logs
          path: apps/desktop/.desktop-build/packaging-runs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
